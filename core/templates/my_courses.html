{% extends "base.html" %}
{% block title %}Learner Portal{% endblock %}
{% block content %}
<section class="py-5 bg-dark text-light">
  <div class="container text-center">
    <h2 class="text-warning mb-4">Learner Portal ©</h2>
    <p class="lead">Built with Django & Bootstrap</p>
    <div class="mt-4">
      <a href="{% url 'course_list' %}" class="btn btn-warning mx-2">Courses</a>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="btn btn-outline-light mx-2">Dashboard</a>
        <a href="{% url 'profile' %}" class="btn btn-outline-light mx-2">Profile</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light mx-2">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-outline-light mx-2">Sign Up</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
