{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="py-5 bg-dark text-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg border-warning bg-dark text-light">
          <div class="card-body">
            <h2 class="text-warning mb-4 text-center">Login</h2>

            <!-- Flash messages -->
            {% if messages %}
              {% for message in messages %}
                <div class="alert 
                  {% if message.tags == 'success' %}alert-success
                  {% elif message.tags == 'error' %}alert-danger
                  {% elif message.tags == 'warning' %}alert-warning
                  {% else %}alert-info{% endif %}
                  alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endif %}

            <!-- Login form -->
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-warning w-100 mt-3">Login</button>
            </form>

            <p class="mt-3 text-center">
              Don’t have an account? 
              <a href="{% url 'signup' %}" class="text-warning">Sign Up</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
